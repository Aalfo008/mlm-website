<div class="card" style="margin-top:48px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:none;background:var(--gold-50)"><div><b>Share this article</b><p class="muted" style="margin:0;font-size:.9rem">Help more people find Muslim voices in media.</p></div><button class="btn btn-sm" id="share">Share</button></div>

<script src="assets/js/marked.min.js"></script>

<script>
MLM.ready.then(async () => {
  const {json, text, md, esc, fmtDate, param, $, toast} = MLM;
  const posts = await MLM.posts();
  const p = posts.find(x => x.slug === param("p"));
  if (!p) { $("#body").innerHTML = '<h1>Article not found</h1>'; return; }
  document.title = p.title + " — Muslim Leadership Media";
  $("#hero-slot").innerHTML = `<section class="page-hero"><div class="wrap"><div class="article-head"><div class="crumbs"><a href="blog.html">Blog</a></div><h1>${esc(p.title)}</h1><div class="article-meta"><span>By ${esc(p.author)}</span><span>·</span><span>${fmtDate(p.date)}</span></div></div></div></section>`;
  $("#body").innerHTML = (p.image?`<img src="${esc(p.image)}" alt="">`:"") + md(p.body || "");
  $("#tags").innerHTML = (p.tags||[]).map(t=>`<span class="chip line">${esc(t)}</span>`).join("");
  $("#share").onclick = async () => { try { if (navigator.share) await navigator.share({title:p.title,url:location.href}); else { await navigator.clipboard.writeText(location.href); toast("Link copied!"); } } catch(e){} };
});
</script>
